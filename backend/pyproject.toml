[project]
name = "adaptive-map-backend"
version = "0.1.0"
description = "Backend for Adaptive Map"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.14.0",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "aioredis>=2.0.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.2.1",
    "geopandas>=0.14.3",
    "shapely>=2.0.3",
    "anthropic>=0.21.3",
    "openai>=1.14.2",
    "greenlet (>=3.5.3,<4.0.0)",
    "duckdb (>=1.5.4,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
httpx = "^0.27.0"
black = "^24.3.0"
ruff = "^0.3.4"
mypy = "^1.9.0"

# Week 17-18 GNN work only needs torch + torch-geometric; the rest of the
# Phase 3 stack stays in the (heavier) ml group until its weeks arrive.
[tool.poetry.group.gnn]
optional = true

[tool.poetry.group.gnn.dependencies]
torch = ">=2.6"            # first release with official cp313 macOS-arm64 wheels
torch-geometric = ">=2.6"  # pure-python wheel

# RL stack: preference embeddings (qdrant-client, Week 19-20) + the PPO
# training pipeline (gymnasium/stable-baselines3/mlflow, Week 21-22). ray is
# NOT here — the training script uses SB3-PPO, not rllib, which also avoids
# ray's py3.13/arm64 wheel gaps.
[tool.poetry.group.rl]
optional = true

[tool.poetry.group.rl.dependencies]
qdrant-client = ">=1.8.2"
stable-baselines3 = ">=2.4.0"  # 2.2.1 predates cp313 wheels
gymnasium = ">=0.29.1"
mlflow = ">=2.11.1"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
ray = {version = ">=2.10.0", extras = ["rllib"]}
flwr = ">=1.8.0"
faster-whisper = ">=1.0.1"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit a live Valhalla instance (skipped if unavailable)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
